name: LAC Portaria - browser regression
on:
  push:
    branches: [fix/portaria-jspdf-sri-20261122]
    paths:
      - '1 - controle-acesso-motoristas.html'
      - 'tests/portaria_browser_regression.cjs'
      - '.github/workflows/lac-portaria-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - '1 - controle-acesso-motoristas.html'
      - 'tests/portaria_browser_regression.cjs'
      - '.github/workflows/lac-portaria-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public browser tooling outside repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lac-browser"
          npm install --prefix "$RUNNER_TEMP/lac-browser" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/lac-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run synthetic browser regressions
        env:
          LAC_PLAYWRIGHT_MODULE: ${{ runner.temp }}/lac-browser/node_modules/playwright
          LAC_TEST_OUTPUT: ${{ runner.temp }}/lac-portaria-results
        run: |
          node --check tests/portaria_browser_regression.cjs
          node tests/portaria_browser_regression.cjs
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portaria-synthetic-browser-evidence
          path: ${{ runner.temp }}/lac-portaria-results
          if-no-files-found: warn
          retention-days: 14
