name: LAC Portaria - verify jsPDF SRI and generated PDF
on:
  pull_request:
    paths:
      - '1 - controle-acesso-motoristas.html'
      - 'tests/portaria_browser_regression.cjs'
      - '.github/workflows/lac-portaria-jspdf-sri.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-jspdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verificar integridade CDNJS e hash do HTML sem modificar arquivos
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 45 \
            https://api.cdnjs.com/libraries/jspdf/4.2.1 --output "$RUNNER_TEMP/jspdf-meta.json"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js --output "$RUNNER_TEMP/jspdf.umd.min.js"
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const meta=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/jspdf-meta.json','utf8'));
          const official=meta.sri?.['jspdf.umd.min.js'];
          const bytes=fs.readFileSync(process.env.RUNNER_TEMP+'/jspdf.umd.min.js');
          const computed='sha512-'+crypto.createHash('sha512').update(bytes).digest('base64');
          if(meta.version!=='4.2.1'||!official||official!==computed)throw Error('CDNJS SRI mismatch');
          const html=fs.readFileSync('1 - controle-acesso-motoristas.html','utf8');
          if(!html.includes('integrity="'+official+'"')||!html.includes('jspdf/4.2.1/jspdf.umd.min.js'))throw Error('HTML SRI mismatch');
          if(/jspdf\/2\.5\.1/.test(html))throw Error('Vulnerable jsPDF version remains');
          const {jsPDF}=require(process.env.RUNNER_TEMP+'/jspdf.umd.min.js');
          const doc=new jsPDF();doc.text('Synthetic PDF test',10,12);
          if(!doc.output().startsWith('%PDF'))throw Error('PDF smoke failed');
          console.log('SRI_OK_AND_PDF_CREATED');
          JS
      - name: Sintaxe dos scripts embutidos
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('1 - controle-acesso-motoristas.html','utf8');
          const inline=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          for(const script of inline)new vm.Script(script,{filename:'portaria-inline.js'});
          console.log('INLINED_SCRIPT_CHECK',inline.length);
          JS
